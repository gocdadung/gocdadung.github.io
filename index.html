/* ============================================================
PHẦN DƯỚI ĐÂY LÀ CODE HIỂN THỊ — không cần chỉnh sửa
============================================================ */

function slugify(str){
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-");
}

const nav = document.getElementById("catNav");
const main = document.getElementById("main");
const navLinks = [];
const sections = [];

CATEGORIES.forEach((cat, catIndex) => {
  const slug = cat.slug || slugify(cat.name);

  const navLink = document.createElement("a");
  navLink.href = "#" + slug;
  navLink.textContent = cat.name;
  nav.appendChild(navLink);
  navLinks.push(navLink);

  const band = document.createElement("div");
  band.className = "band " + (catIndex % 2 === 0 ? "band-a" : "band-b");
  const bandInner = document.createElement("div");
  bandInner.className = "band-inner";

  const section = document.createElement("section");
  section.className = "category";
  section.id = slug;

  const h2 = document.createElement("h2");
  h2.textContent = cat.name;
  section.appendChild(h2);

  if (cat.items.length === 0){
    const empty = document.createElement("p");
    empty.className = "empty-note";
    empty.textContent = "Đang cập nhật sản phẩm — quay lại sớm nhé!";
    section.appendChild(empty);
  } else {
    const grid = document.createElement("div");
    grid.className = "grid";

    cat.items.forEach((item, index) => {
      const div = document.createElement("div");
      let cls = "item";
      if (index >= VISIBLE_COUNT_MOBILE){
        cls += " extra";
      } else if (index >= VISIBLE_COUNT_DESKTOP){
        cls += " extra mobile-visible";
      }
      div.className = cls;
      div.innerHTML = `
        <a class="thumb" href="${item.link}" target="_blank" rel="noopener sponsored">
          <img src="${item.image}" alt="${item.name}" loading="lazy">
        </a>
        <div class="name">${item.name}</div>
      `;
      grid.appendChild(div);
    });

    section.appendChild(grid);

    if(cat.items.length > VISIBLE_COUNT_DESKTOP){
      const wrap = document.createElement("div");
      wrap.className = "view-all-wrap";
      if (cat.items.length <= VISIBLE_COUNT_MOBILE){
        wrap.classList.add("mobile-hide");
      }
      const btn = document.createElement("button");
      btn.className = "view-all";
      btn.textContent = "Xem tất cả (" + cat.items.length + " sản phẩm)";
      btn.addEventListener("click", () => {
        const expanded = section.classList.toggle("expanded");
        btn.textContent = expanded
          ? "Thu gọn"
          : "Xem tất cả (" + cat.items.length + " sản phẩm)";
      });
      wrap.appendChild(btn);
      section.appendChild(wrap);
    }
  }

  bandInner.appendChild(section);
  band.appendChild(bandInner);
  main.appendChild(band);
  sections.push(section);
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    const idx = sections.indexOf(entry.target);
    if (idx === -1) return;
    if (entry.isIntersecting){
      navLinks.forEach(l => l.classList.remove("active"));
      navLinks[idx].classList.add("active");
    }
  });
}, { rootMargin: "-40% 0px -55% 0px", threshold: 0 });

sections.forEach(s => observer.observe(s));
if (navLinks.length){
  navLinks[0].classList.add("active");
}

/* ===== TÌM KIẾM (không phân biệt dấu tiếng Việt) ===== */
function removeDiacritics(str){
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
}

const searchInput = document.getElementById("searchInput");
const searchBox = document.getElementById("searchBox");
const searchClear = document.getElementById("searchClear");
const noResult = document.getElementById("noResult");
const allItemEls = Array.from(document.querySelectorAll(".item"));

function runSearch(){
  const raw = searchInput.value.trim();
  const query = removeDiacritics(raw);
  searchBox.classList.toggle("has-value", raw.length > 0);

  if (query === ""){
    allItemEls.forEach(el => { el.style.display = ""; });
    sections.forEach(s => s.classList.remove("search-hide-cat"));
    noResult.classList.remove("show");
    return;
  }

  let totalVisible = 0;

  sections.forEach((section, idx) => {
    const cat = CATEGORIES[idx];
    let visibleInCat = 0;
    const itemEls = section.querySelectorAll(".item");
    itemEls.forEach((el, i) => {
      const product = cat.items[i];
      const haystack = removeDiacritics(product.name + " " + (product.note || ""));
      const match = haystack.includes(query);
      el.style.display = match ? "block" : "none";
      if (match) visibleInCat++;
    });
    section.classList.toggle("search-hide-cat", visibleInCat === 0);
    totalVisible += visibleInCat;
  });

  noResult.classList.toggle("show", totalVisible === 0);
}

searchInput.addEventListener("input", runSearch);
searchClear.addEventListener("click", () => {
  searchInput.value = "";
  runSearch();
  searchInput.focus();
});

/* ===== NÚT VỀ ĐẦU TRANG ===== */
const backToTop = document.getElementById("backToTop");
window.addEventListener("scroll", () => {
  backToTop.classList.toggle("show", window.scrollY > 500);
});
backToTop.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
